AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Altus Retreats — Multi-property STR platform
  Products: direct booking sites, digital guidebook, admin system
  altusretreats.net

# ─────────────────────────────────────────────
# Parameters
# ─────────────────────────────────────────────
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  DomainName:
    Type: String
    Default: altusretreats.net
    Description: Root domain (Route 53 hosted zone must exist)

# ─────────────────────────────────────────────
# Globals
# ─────────────────────────────────────────────
Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 256
    Architectures: [arm64]
    Environment:
      Variables:
        TABLE_NAME: !Ref MainTable
        ENVIRONMENT: !Ref Environment
    Layers:
      - !Ref SharedLayer

# ─────────────────────────────────────────────
# Resources
# ─────────────────────────────────────────────
Resources:

  # ── DynamoDB ──────────────────────────────
  MainTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub altus-retreats-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # GSI1: look up bookings by property + check-in date
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # GSI2: retained legacy payment lookup; active checkout is Hospitable Direct
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: altus-retreats
        - Key: Environment
          Value: !Ref Environment

  # ── Cognito (Admin Auth) ──────────────────
  AdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub altus-retreats-admin-${Environment}
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true   # invite-only; no self-signup
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      MfaConfiguration: "OFF"
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: property_access
          AttributeDataType: String
          Mutable: true
          # comma-separated property IDs; "ALL" = super admin

  AdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: altus-retreats-admin-client
      UserPoolId: !Ref AdminUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30

  # ── Secrets Manager ───────────────────────
  HospitableSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub altus-retreats/${Environment}/hospitable
      Description: Hospitable API PAT per property
      # Structure: { "default": "<PAT>", "kentucky": "<PAT>", "florida": "<PAT>" }
      SecretString: '{"default": "REPLACE_ME"}'

  GoogleSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub altus-retreats/${Environment}/google
      Description: Google Places API key for guidebook local recommendations
      # Structure: { "placesApiKey": "AIza..." }
      SecretString: '{"placesApiKey": "REPLACE_ME"}'

  # ── Shared Lambda Layer ───────────────────
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub altus-retreats-shared-${Environment}
      ContentUri: ../backend/layers/shared
      CompatibleRuntimes:
        - nodejs22.x
      CompatibleArchitectures:
        - arm64

  # ── API Gateway ───────────────────────────
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub altus-retreats-api-${Environment}
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"   # tighten to property domains in prod
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt AdminUserPool.Arn
      GatewayResponses:
        UNAUTHORIZED:
          StatusCode: 401
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
          ResponseTemplates:
            application/json: '{"error": "Unauthorized"}'
        ACCESS_DENIED:
          StatusCode: 403
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
          ResponseTemplates:
            application/json: '{"error": "Forbidden"}'
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization'"
      Tags:
        Project: altus-retreats
        Environment: !Ref Environment

  # ── Lambda: getProperty ───────────────────
  GetPropertyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub altus-retreats-getProperty-${Environment}
      CodeUri: ../backend/functions/getProperty
      Handler: index.handler
      Description: Returns property metadata, photos, and amenities from DynamoDB (cached from Hospitable)
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MainTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref HospitableSecret
      Events:
        GetProperty:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /properties/{propertyId}
            Method: GET
            Auth:
              Authorizer: NONE   # public endpoint

  # ── Lambda: getAvailability ───────────────
  GetAvailabilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub altus-retreats-getAvailability-${Environment}
      CodeUri: ../backend/functions/getAvailability
      Handler: index.handler
      Description: Proxies Hospitable calendar API; returns blocked dates and pricing for a property
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MainTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref HospitableSecret
      Events:
        GetAvailability:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /properties/{propertyId}/availability
            Method: GET
            Auth:
              Authorizer: NONE   # public endpoint

  # ── Lambda: getGuidebook ──────────────────
  GetGuidebookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub altus-retreats-getGuidebook-${Environment}
      CodeUri: ../backend/functions/getGuidebook
      Handler: index.handler
      Description: Returns guidebook sections and items for a property (guest-facing, public)
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MainTable
      Events:
        GetGuidebook:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /properties/{propertyId}/guidebook
            Method: GET
            Auth:
              Authorizer: NONE   # public endpoint

  # ── Lambda: getReviews ────────────────────
  GetReviewsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub altus-retreats-getReviews-${Environment}
      CodeUri: ../backend/functions/getReviews
      Handler: index.handler
      Description: Returns guest reviews for a property from Hospitable API (public endpoint)
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MainTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref HospitableSecret
      Events:
        GetReviews:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /properties/{propertyId}/reviews
            Method: GET
            Auth:
              Authorizer: NONE   # public endpoint

  # ── Lambda: adminProperties ───────────────
  AdminPropertiesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub altus-retreats-adminProperties-${Environment}
      CodeUri: ../backend/functions/adminProperties
      Handler: index.handler
      Description: CRUD for property records — admin only (Cognito protected)
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref HospitableSecret
      Events:
        ListProperties:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/properties
            Method: GET
        GetProperty:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/properties/{propertyId}
            Method: GET
        CreateProperty:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/properties
            Method: POST
        UpdateProperty:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/properties/{propertyId}
            Method: PUT

  # ── Lambda: syncProperty ──────────────────
  SyncPropertyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub altus-retreats-syncProperty-${Environment}
      CodeUri: ../backend/functions/syncProperty
      Handler: index.handler
      Timeout: 60
      Description: Fetches Hospitable listing data and caches it in DynamoDB — admin only
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref HospitableSecret
      Events:
        SyncProperty:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/properties/{propertyId}/sync
            Method: POST

  # ── Lambda: adminHub ──────────────────────
  AdminHubFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub altus-retreats-adminHub-${Environment}
      CodeUri: ../backend/functions/adminHub
      Handler: index.handler
      Description: GET/PUT hub site content (altusretreats.net) — admin only
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
      Events:
        GetHub:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/hub
            Method: GET
        UpdateHub:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/hub
            Method: PUT

  # ── Lambda: adminMedia ────────────────────
  AdminMediaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub altus-retreats-adminMedia-${Environment}
      CodeUri: ../backend/functions/adminMedia
      Handler: index.handler
      Description: Returns presigned S3 PUT URLs for direct browser media upload — admin only
      Environment:
        Variables:
          MEDIA_BUCKET: !Ref MediaBucket
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MainTable
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "${MediaBucket.Arn}/properties/*"
      Events:
        SignUpload:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/media/sign
            Method: POST

  # ── EventBridge: daily Hospitable sync ───
  DailySyncRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub altus-retreats-daily-sync-${Environment}
      Description: Triggers daily Hospitable sync for all properties at 2am UTC
      ScheduleExpression: cron(0 7 * * ? *)   # 2am EST = 7am UTC
      State: ENABLED
      Targets:
        - Id: SyncPropertyKentucky
          Arn: !GetAtt SyncPropertyFunction.Arn
          Input: !Sub |
            {"httpMethod":"POST","pathParameters":{"propertyId":"kentucky"},"body":"{}","headers":{"Authorization":"internal-scheduler"}}

  # ── Lambda: adminPlaceLookup ─────────────
  AdminPlaceLookupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub altus-retreats-adminPlaceLookup-${Environment}
      CodeUri: ../backend/functions/adminPlaceLookup
      Handler: index.handler
      Timeout: 20
      Description: Parses Google Maps URL, calls Places API, calculates distance — admin only
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MainTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref GoogleSecret
      Events:
        LookupPlace:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/properties/{propertyId}/places/lookup
            Method: POST

  # ── Lambda: adminGuidebook ────────────────
  AdminGuidebookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub altus-retreats-adminGuidebook-${Environment}
      CodeUri: ../backend/functions/adminGuidebook
      Handler: index.handler
      Description: CRUD for guidebook sections and items — admin only (Cognito protected)
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
      Events:
        ListSections:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/properties/{propertyId}/guidebook
            Method: GET
        UpsertSection:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/properties/{propertyId}/guidebook/{sectionId}
            Method: PUT
        DeleteSection:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/properties/{propertyId}/guidebook/{sectionId}
            Method: DELETE

  # ── Lambda: waitlist ──────────────────────
  WaitlistFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub altus-retreats-waitlist-${Environment}
      CodeUri: ../backend/functions/waitlist
      Handler: index.handler
      Description: Public POST to capture waitlist emails; authenticated GET for admin to list them.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
      Events:
        SubmitWaitlist:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /waitlist
            Method: POST
            Auth:
              Authorizer: NONE
        GetWaitlist:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/waitlist
            Method: GET

  # ── Lambda: adminBookings ─────────────────
  AdminBookingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub altus-retreats-adminBookings-${Environment}
      CodeUri: ../backend/functions/adminBookings
      Handler: index.handler
      Description: Lists bookings for a property — admin only (Cognito protected). Supports filtering by status and date range.
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MainTable
      Events:
        ListBookings:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /admin/properties/{propertyId}/bookings
            Method: GET

  # ── Lambda: sendConfirmationEmail ────────
  SendConfirmationEmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub altus-retreats-sendConfirmationEmail-${Environment}
      CodeUri: ../backend/functions/sendConfirmationEmail
      Handler: index.handler
      Description: Legacy booking confirmation email sender. Active checkout is handled by Hospitable Direct.
      Environment:
        Variables:
          FROM_EMAIL: !Sub "Altus Retreats <support@${DomainName}>"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      # No API event; retained for compatibility with legacy booking records.

  # ── Lambda: sendPreArrivalEmail ───────────
  SendPreArrivalEmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub altus-retreats-sendPreArrivalEmail-${Environment}
      CodeUri: ../backend/functions/sendPreArrivalEmail
      Handler: index.handler
      Description: Sends pre-arrival email with guidebook link 48hrs before check-in. Invoked by EventBridge Scheduler.
      Environment:
        Variables:
          FROM_EMAIL: !Sub "Altus Retreats <support@${DomainName}>"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      # No API event — invoked by EventBridge Scheduler

  # ── IAM Role: EventBridge Scheduler → Lambda ─
  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub altus-retreats-scheduler-invoke-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokePreArrivalEmailLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt SendPreArrivalEmailFunction.Arn

  # ── Permission: EventBridge → SyncProperty ─
  DailySyncPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SyncPropertyFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailySyncRule.Arn

  # ── S3 Buckets ────────────────────────────
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub altus-retreats-media-${Environment}-${AWS::AccountId}
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST]
            AllowedOrigins: ['*']
            MaxAge: 3600
      PublicAccessBlockConfiguration:
        # ACLs stay blocked (no ACL-based public grants) — only the narrow
        # bucket policy below (properties/* GetObject) is allowed public.
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false

  # Property photos (hero slider, guidebook place images, etc.) are embedded
  # as direct S3 URLs in property content and must be publicly readable.
  # Scoped to properties/* only — matches AdminMediaFunction's upload prefix.
  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${MediaBucket.Arn}/properties/*"

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub altus-retreats-frontend-${Environment}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ── CloudFront Function: directory index rewrite ──
  # S3 with OAC doesn't serve index.html for directory paths (/guidebook/ etc.)
  # This function rewrites /path/ → /path/index.html before hitting S3.
  DirectoryIndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub altus-directory-index-${Environment}
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite directory URLs to index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri += 'index.html';
          } else if (!uri.split('/').pop().includes('.')) {
            request.uri += '/index.html';
          }
          return request;
        }

  # ── CloudFront OAC (Origin Access Control) ──
  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub altus-retreats-oac-${Environment}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── Hub Site (altusretreats.net) ─────────────
  HubSiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub altus-retreats-hub-${Environment}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  HubSiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Aliases:
          - altusretreats.net
          - www.altusretreats.net
        ViewerCertificate:
          AcmCertificateArn: arn:aws:acm:us-east-1:817760095908:certificate/8706f7a7-0149-4b42-b9ed-cdc8c7644573
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: S3Hub
            DomainName: !GetAtt HubSiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Hub
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
      Tags:
        - Key: Project
          Value: altus-retreats
        - Key: Environment
          Value: !Ref Environment

  HubSiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref HubSiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${HubSiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${HubSiteDistribution}"

  # ── CloudFront: Property Booking Site ────────
  PropertySiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Aliases:
          - staytheoverhang.com
          - www.staytheoverhang.com
        ViewerCertificate:
          AcmCertificateArn: arn:aws:acm:us-east-1:817760095908:certificate/f5ddb05c-69c5-43cc-95af-9445a788ac22
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: S3Frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Frontend
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt DirectoryIndexFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
      Tags:
        - Key: Project
          Value: altus-retreats
        - Key: Environment
          Value: !Ref Environment

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${PropertySiteDistribution}"

  # ── CloudFront: Admin SPA ─────────────────────
  AdminSPABucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub altus-retreats-admin-${Environment}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AdminSPADistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Aliases:
          - admin.altusretreats.net
        ViewerCertificate:
          AcmCertificateArn: arn:aws:acm:us-east-1:817760095908:certificate/11d974d7-4aa6-42d7-bcf0-4a9ae09bfd08
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: S3Admin
            DomainName: !GetAtt AdminSPABucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Admin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          AllowedMethods: [GET, HEAD, OPTIONS]
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  AdminSPABucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AdminSPABucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${AdminSPABucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${AdminSPADistribution}"

# ─────────────────────────────────────────────
# Outputs
# ─────────────────────────────────────────────
Outputs:
  ApiUrl:
    Description: API Gateway endpoint
    Value: !Sub https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub altus-retreats-ApiUrl-${Environment}

  TableName:
    Description: DynamoDB table name
    Value: !Ref MainTable
    Export:
      Name: !Sub altus-retreats-TableName-${Environment}

  UserPoolId:
    Description: Cognito User Pool ID for admin auth
    Value: !Ref AdminUserPool
    Export:
      Name: !Sub altus-retreats-UserPoolId-${Environment}

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref AdminUserPoolClient
    Export:
      Name: !Sub altus-retreats-UserPoolClientId-${Environment}

  MediaBucketName:
    Description: S3 bucket for property photos and guidebook media
    Value: !Ref MediaBucket
    Export:
      Name: !Sub altus-retreats-MediaBucket-${Environment}

  HubSiteUrl:
    Description: CloudFront URL for the hub site (altusretreats.net)
    Value: !Sub "https://${HubSiteDistribution.DomainName}"
    Export:
      Name: !Sub altus-retreats-HubSiteUrl-${Environment}

  HubSiteBucketName:
    Description: S3 bucket for hub site
    Value: !Ref HubSiteBucket
    Export:
      Name: !Sub altus-retreats-HubSiteBucket-${Environment}

  PropertySiteUrl:
    Description: CloudFront URL for the property booking site
    Value: !Sub "https://${PropertySiteDistribution.DomainName}"
    Export:
      Name: !Sub altus-retreats-PropertySiteUrl-${Environment}

  AdminSPAUrl:
    Description: CloudFront URL for the admin SPA
    Value: !Sub "https://${AdminSPADistribution.DomainName}"
    Export:
      Name: !Sub altus-retreats-AdminSPAUrl-${Environment}

  AdminSPABucketName:
    Description: S3 bucket for admin SPA
    Value: !Ref AdminSPABucket
    Export:
      Name: !Sub altus-retreats-AdminSPABucket-${Environment}

  MediaBucketArn:
    Description: S3 ARN for media bucket (used by adminMedia presigned URL policy)
    Value: !GetAtt MediaBucket.Arn
    Export:
      Name: !Sub altus-retreats-MediaBucketArn-${Environment}
