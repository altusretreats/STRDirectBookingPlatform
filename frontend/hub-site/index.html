<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altus Retreats — Elevate Your Getaway</title>
  <meta name="description" content="Something exceptional is coming. Altus Retreats — a curated collection of unforgettable vacation properties.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #2D3A2E;
      --gold:  #C9A84C;
      --cream: #F5EFE4;
      --muted: rgba(45,58,46,0.45);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--cream);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
      text-align: center;
      overflow-x: hidden;
    }

    /* Subtle texture overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(201,168,76,0.07) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(45,58,46,0.04) 0%, transparent 50%);
      pointer-events: none;
    }

    .logo {
      width: min(340px, 80vw);
      margin-bottom: 32px;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 1s ease forwards 0.2s;
    }

    .divider {
      width: 48px; height: 1px;
      background: var(--gold);
      margin: 0 auto 32px;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.6s;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 600;
      color: var(--green);
      line-height: 1.15;
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.7s;
    }

    h1 em {
      font-style: italic;
      color: var(--gold);
    }

    .tagline {
      font-size: clamp(12px, 1.5vw, 14px);
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 56px;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.9s;
    }

    .notify-form {
      display: flex;
      gap: 0;
      max-width: 420px;
      width: 100%;
      margin: 0 auto 24px;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 1.1s;
    }

    .notify-form input {
      flex: 1;
      padding: 14px 20px;
      background: rgba(45,58,46,0.06);
      border: 1px solid rgba(45,58,46,0.2);
      border-right: none;
      border-radius: 4px 0 0 4px;
      color: var(--green);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .notify-form input::placeholder { color: rgba(45,58,46,0.35); }
    .notify-form input:focus {
      background: rgba(45,58,46,0.09);
      border-color: rgba(45,58,46,0.4);
    }

    .notify-form button {
      padding: 14px 24px;
      background: var(--green);
      color: var(--cream);
      border: none;
      border-radius: 0 4px 4px 0;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      white-space: nowrap;
      transition: opacity 0.2s;
    }

    .notify-form button:hover { opacity: 0.85; }

    .success-msg {
      display: none;
      font-size: 13px;
      color: var(--gold);
      letter-spacing: 0.05em;
      margin-bottom: 24px;
    }

    .contact {
      font-size: 12px;
      color: rgba(45,58,46,0.35);
      letter-spacing: 0.08em;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 1.2s;
    }

    .contact a {
      color: rgba(45,58,46,0.5);
      text-decoration: none;
      transition: color 0.2s;
    }
    .contact a:hover { color: var(--gold); }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .notify-form { flex-direction: column; }
      .notify-form input {
        border-right: 1px solid rgba(255,255,255,0.18);
        border-bottom: none;
        border-radius: 4px 4px 0 0;
      }
      .notify-form button { border-radius: 0 0 4px 4px; padding: 14px; }
    }
  </style>
</head>
<body>

  <img src="assets/altus-logo.png" alt="Altus Retreats" class="logo">

  <div class="divider"></div>

  <h1>Something <em>exceptional</em><br>is coming.</h1>

  <p class="tagline">Elevate Your Getaway</p>

  <form class="notify-form" id="notifyForm">
    <input type="email" placeholder="Your email address" required id="emailInput">
    <button type="submit">Notify Me</button>
  </form>

  <p class="success-msg" id="successMsg">✓ &nbsp;You're on the list. We'll be in touch.</p>

  <p class="contact">Questions? <a href="mailto:support@altusretreats.net">support@altusretreats.net</a></p>

  <script>
    const API = 'https://teh1cl4b6a.execute-api.us-east-1.amazonaws.com/dev';
    document.getElementById('notifyForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      try {
        await fetch(`${API}/waitlist`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, source: 'altusretreats.net' }),
        });
      } catch (_) {}
      this.style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    });
  </script>

</body>
</html>
